name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Lint
        run: bazelisk run //:lint

      - name: Test
        run: bazelisk test //:test --test_output=errors

      - name: Build
        run: bazelisk build //:site_export
        env:
          NODE_ENV: production

      - name: Verify export artifact
        run: test -f ./bazel-bin/out/index.html

      - name: Smoke test exported routes
        run: node scripts/smoke-export.mjs ./bazel-bin/out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./bazel-bin/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
